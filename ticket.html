<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Coding Conf | Ticket</title>
        <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet"style.css">
        <link rel="icon" href="logo-mark.svg" type="image/svg">
    </head>
    <body>
        <header>
            <img src="logo-full.svg" alt="Coding Conf Logo">
            <nav>
                <ul>
                    <li><a href="index.html">Back to Home</a></li>
                </ul>
            </nav>
        </header>
        <main class="ticket_page">
            <h1>Congrats, <span id="ticket-name"></span>! Your ticket is ready.</h1>
            <p>We've emailed your ticket to <span id="ticket-email"></span> 
               and will send updates in the run up to the event.</p>
            
            <article class="ticket">
                <div class="ticket_header"><img src="logo-full.svg" alt="Coding Conf">
                    <p>Oct 26, 2026 / Papine, Kgn</p>
                </div>

                <div class="ticket_details">
                    <img id="ticket-avatar" alt="">
                    <div class="ticket_info">
                        <h2 id="ticket-fullname"></h2>
                        <p><img src="icon-github.svg" alt="GitHub">
                            <span id="ticket-github"></span></p>
                    </div>
                </div>
                <p id="ticket-number"></p>
            </article>
        </main>
        <footer>
            <p>&copy; 2026 Coding Conf by Aryann Buddoo #2111004. All rights reserved.</p>
        </footer>
        <script src="ticket.js"></script>
    </body>
</html>
